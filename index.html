<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktik Nginx - FE & BE</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; background: #f4f4f9; }
        .card { background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 500px; }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #result { margin-top: 1rem; padding: 10px; background: #e9ecef; border-radius: 4px; word-break: break-all; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Frontend & Backend via Nginx Proxy</h2>
        <p>Klik tombol di bawah untuk mengambil data dari Backend Go melalui endpoint <code>/api/hello</code>.</p>
        <button id="btnFetch">Panggil Backend Go</button>
        <div id="result">Menunggu interaksi...</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
